# 官方镜像发布：手动触发（Actions 页面 Run workflow 并输入版本号）。
# 使用内置 GITHUB_TOKEN 推送 ghcr.io（packages:write），无需配置任何密钥。
# 触发即发布：请确认版本号与仓库版本一致后再运行。
name: publish-image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本标签（小写字母/数字/./-，禁止 latest，例如 0.1.0）"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 校验版本号
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[a-z0-9_][a-z0-9_.-]{0,127}$ || "$VERSION" == latest ]]; then
            echo "非法版本标签：$VERSION（仅允许小写字母/数字/./-/_，且不得为 latest）" >&2
            exit 1
          fi

      - name: 计算镜像名（命名空间转小写）
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mcp-asset-gateway" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像地址
        run: printf '已发布：%s:%s\n' '${{ steps.image.outputs.name }}' '${{ inputs.version }}'
