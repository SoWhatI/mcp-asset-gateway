version: "2.4"
services:
  gateway:
    # 默认拉取官方多架构镜像；自行构建时用 IMAGE_NAME 覆盖（见 build-and-push.sh）。
    image: ${IMAGE_NAME:-ghcr.io/sowhati/mcp-asset-gateway}:${IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/gateway.db
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8303}:8303"
    volumes:
      - gateway-data:/app/data
      - gateway-backups:/app/backups
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  gateway-data:
  gateway-backups:
