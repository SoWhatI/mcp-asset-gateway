[project]
name = "mcp-asset-gateway"
version = "0.1.0"
requires-python = ">=3.11"
description = "多类型资产 MCP 网关"
readme = "README.md"
license = "MIT"
# 运行时依赖与 requirements.in 保持一致；发布安装仍以 requirements.lock（哈希锁定）
# 为准，此处声明供 uv/pip 等标准工具链（如目录检查的 uv sync）直接解析。
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pymysql>=1.2,<2",
    "redis>=8,<9",
    "paramiko>=5.0.0,<6",
    "cryptography>=50.0.1,<51",
    "bcrypt>=4.2,<6",
    "mcp>=1.30,<3",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "sqlglot>=26,<31",
    "python-dotenv>=1.0,<2",
    "regex>=2024.11,<2027",
    "wsproto>=1.2,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
