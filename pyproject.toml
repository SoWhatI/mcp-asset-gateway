[project]
name = "mcp-asset-gateway"
version = "0.1.0"
requires-python = ">=3.11"
description = "多类型资产 MCP 网关"
readme = "README.md"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
